<!doctype html>
<!-- Modelo da imagem de compartilhamento (1200x630). Gerada por fonte/gerar_og.js -->
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="assets/css/site.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--papel)}
.og{display:grid;grid-template-columns:1fr 430px;height:630px}
.og-texto{padding:64px 0 56px 72px;display:flex;flex-direction:column;justify-content:space-between}
.og h1{font-size:118px;line-height:.9;letter-spacing:-.02em;margin:0 0 0 -4px}
.og h1 em{color:var(--vinho)}
.og-assinatura{display:flex;gap:16px;align-items:center}
.og-assinatura .monograma{width:52px;height:52px;font-size:24px;color:var(--bronze-texto);border-color:var(--bronze)}
.og-nome{font:400 30px/1.1 var(--serif)}
.og-oab{font:500 14px/1.4 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--bronze-texto)}
.og-foto{position:relative;background:var(--grafite)}
.og-foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%}
</style></head><body>
<div class="og"><div class="og-texto"><p class="rotulo" style="font-size:15px">Advocacia criminal · Natal, Parnamirim e região</p>
<h1>Defesa <em>criminal</em> em Natal.</h1>
<div class="og-assinatura"><span class="monograma">MB</span><div><div class="og-nome">Melquisedeque de Brito Trindade</div><div class="og-oab">OAB/RN 23.477</div></div></div></div>
<div class="og-foto"><img src="assets/img/retrato-mesa@2x.webp" alt=""></div></div>
</body></html>
