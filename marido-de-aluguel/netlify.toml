# ==========================================================================
# Publicação no Netlify — site "Marido de aluguel"
# --------------------------------------------------------------------------
# ATENÇÃO: este repositório tem DOIS sites. Para o Netlify ler ESTE arquivo,
# e não o da raiz, é obrigatório definir na hora de criar o site:
#
#     Base directory = marido-de-aluguel
#
# Com o base directory definido, o Netlify acha o comando de build e a pasta
# de publicação sozinho — não precisa preencher mais nada na interface.
# O passo a passo está no README.md, em "Publicar no Netlify".
# ==========================================================================

[build]
  # Monta uma pasta só com os arquivos do site e troca o endereço provisório
  # pelo endereço real do deploy. Veja netlify-build.sh.
  command = "bash netlify-build.sh"
  publish = "_site"

# --------------------------------------------------------------------------
# Cabeçalhos
# --------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    X-Frame-Options        = "SAMEORIGIN"

# O HTML e os dados do negócio precisam ser sempre revalidados: uma troca de
# telefone no config.js tem que aparecer na hora.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# As fontes nunca mudam de conteúdo sem mudar de nome.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Um dia, e não um ano, porque as fotos dos serviços ainda vão entrar com
# estes mesmos nomes. Depois que elas estiverem no ar e estáveis, dá para
# subir para "public, max-age=31536000, immutable".
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
