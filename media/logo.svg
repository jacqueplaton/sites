<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Delícias Brasil Florida">
  <!-- ====================================================================
       LOGOTIPO PROVISÓRIO
       Desenhado a partir da paleta descrita no briefing (fruta dourada +
       folha verde). NÃO é o logotipo oficial — o arquivo original não foi
       enviado. Para trocar: substitua este arquivo mantendo o mesmo nome
       (media/logo.svg) e, de preferência, o viewBox quadrado.
       ==================================================================== -->
  <defs>
    <linearGradient id="fruta" x1="22%" y1="10%" x2="80%" y2="92%">
      <stop offset="0" stop-color="#F6CE6A"/>
      <stop offset="55%" stop-color="#E9A82C"/>
      <stop offset="100%" stop-color="#C7541D"/>
    </linearGradient>
  </defs>

  <!-- fruta -->
  <circle cx="32" cy="37" r="21" fill="url(#fruta)"/>

  <!-- brilho -->
  <path d="M20 30c3-5 8-8 13-8" fill="none" stroke="#FFF3D6" stroke-width="3"
        stroke-linecap="round" opacity=".55"/>

  <!-- gomos, lembrando uma fruta cortada -->
  <g fill="none" stroke="#8A4212" stroke-width="1.4" stroke-linecap="round" opacity=".45">
    <path d="M32 20v34"/>
    <path d="M15.5 30.5c11 5 22 5 33 0"/>
    <path d="M15.5 43.5c11-5 22-5 33 0"/>
  </g>

  <!-- folha -->
  <path d="M34 17c1-7 7-11 14-11 1 7-4 13-11 14-1 0-2 0-3-1z" fill="#2A6B48"/>
  <path d="M36.5 16.5C39 12 42.5 9.5 46 8.5" fill="none" stroke="#6E9C82"
        stroke-width="1.5" stroke-linecap="round"/>

  <!-- cabinho -->
  <path d="M32 20c0-3 .6-5 2-7" fill="none" stroke="#14452F" stroke-width="2.6"
        stroke-linecap="round"/>
</svg>
