name: Publicar site no GitHub Pages

# Roda a cada push nesta branch. Para publicar sem alterar nada, use o botão
# "Run workflow" na aba Actions do repositório.
on:
  push:
    branches: [claude/session-x6jjir]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; nunca cancela uma que já começou.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Separar só os arquivos do site
        run: |
          mkdir -p _site
          cp -r index.html favicon.svg robots.txt sitemap.xml \
                css js fonts media _site/
          # impede o Jekyll de reprocessar (e de ignorar arquivos)
          touch _site/.nojekyll
          echo "Arquivos publicados:"
          du -sh _site
          find _site -type f | wc -l

      - name: Preparar o GitHub Pages
        # enablement liga o Pages automaticamente na primeira execução,
        # sem precisar mexer nas configurações do repositório.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
