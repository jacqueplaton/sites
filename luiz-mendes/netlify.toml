# ==========================================================================
# Netlify — site Luiz Mendes
# --------------------------------------------------------------------------
# Este site vive na subpasta luiz-mendes/ do repositório. Ao criar o site no
# Netlify (Add new site → Import an existing project), defina:
#
#   Base directory:    luiz-mendes
#   Publish directory: luiz-mendes  (o Netlify preenche ao ler este arquivo)
#
# Não há etapa de build: é HTML/CSS/JS puro.
# ==========================================================================

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    X-Frame-Options        = "SAMEORIGIN"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
