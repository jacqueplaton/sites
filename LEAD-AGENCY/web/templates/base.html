<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}LEAD AGENCY{% endblock %}</title>
  <link rel="stylesheet" href="/static/estilo.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
</head>
<body data-pagina="{{ pagina }}" {% if lead_id %}data-lead-id="{{ lead_id }}"{% endif %}>
  <div class="layout">
    <aside class="menu">
      <div class="marca">
        <span class="marca-icone">🎯</span>
        <div>
          <strong>LEAD AGENCY</strong>
          <small>prospecção e sites</small>
        </div>
      </div>
      <nav>
        {% for href, rotulo, chave in menu %}
        <a href="{{ href }}" class="{{ 'ativo' if chave == pagina else '' }}">{{ rotulo }}</a>
        {% endfor %}
      </nav>
      <div class="aviso-menu">
        Nenhuma mensagem é enviada pelo app. Todo texto gerado é rascunho para
        revisão humana.
      </div>
    </aside>

    <main class="conteudo">
      <header class="topo">
        <h1>{% block cabecalho %}{% endblock %}</h1>
        <div class="topo-acoes">{% block acoes %}{% endblock %}</div>
      </header>
      {% block corpo %}{% endblock %}
    </main>
  </div>

  <div id="aviso" class="aviso" hidden></div>
  <script src="/static/app.js" type="module"></script>
</body>
</html>
