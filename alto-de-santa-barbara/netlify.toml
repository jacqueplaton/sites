# ==========================================================================
# Netlify — este site fica numa subpasta do repositório.
# Na criação do site no Netlify, preencha "Base directory" com:
#     alto-de-santa-barbara
# O restante (comando e pasta publicada) vem deste arquivo.
# ==========================================================================
[build]
  command = "bash build.sh"
  publish = "_site"

# Prévia por padrão. Para a versão definitiva, defina no painel do Netlify:
#   SITE_URL = https://dominio-definitivo
#   INDEXAR  = sim
[build.environment]
  INDEXAR = "nao"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
