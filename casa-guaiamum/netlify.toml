# ==========================================================================
# Casa Guaiamum — publicação na Netlify
# --------------------------------------------------------------------------
# O site é estático: não há build, nem npm, nem framework. O index.html já
# está na raiz desta pasta.
#
# Duas formas de publicar (veja o README.md):
#
#  A) Deploy manual: arraste a PASTA casa-guaiamum inteira para a área de
#     deploy do projeto na Netlify. Este arquivo é ignorado nesse modo.
#
#  B) Repositório conectado: em Site configuration → Build & deploy, defina
#     Base directory = casa-guaiamum. A Netlify passa a ler este arquivo e
#     publica sozinha.
# ==========================================================================

[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    X-Frame-Options        = "SAMEORIGIN"

# O HTML precisa ser revalidado sempre, senão uma correção demora a aparecer.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# As fotografias só mudam de conteúdo se mudarem de nome.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
